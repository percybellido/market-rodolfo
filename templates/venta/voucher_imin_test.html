
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prueba impresión nativa iMin</title>

    <script src="{% static 'js/imin-printer.min.js' %}"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e9ecef;
            padding: 20px;
            margin: 0;
        }

        .panel-control {
            max-width: 576px;
            margin: auto;
            text-align: center;
        }

        .btn-imprimir {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
        }

        .btn-imprimir:disabled {
            background: #6c757d;
        }

        #estado {
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="panel-control">

    <button id="btnImprimir"
            class="btn-imprimir"
            disabled>
        CONECTANDO CON IMPRESORA...
    </button>

    <div id="estado">Iniciando WebPrint...</div>

</div>

<script>
    const IminPrintInstance = new IminPrinter();

    const btnImprimir = document.getElementById("btnImprimir");
    const textoEstado = document.getElementById("estado");

    let impresoraLista = false;

    // 1. Conexión con WebPrint
    IminPrintInstance.connect()
        .then((isConnect) => {

            if (isConnect) {

                // Inicialización SPI
                IminPrintInstance.initPrinter();

                impresoraLista = true;

                btnImprimir.disabled = false;
                btnImprimir.innerText = "IMPRIMIR TICKET DE PRUEBA";

                textoEstado.innerText = "Conectado a iMin Swan 2";

            } else {

                textoEstado.innerText =
                    "No se pudo conectar con WebPrint.";
            }

        })
        .catch((error) => {

            textoEstado.innerText =
                "Error de conexión: " + error;
        });


    // 2. Impresión nativa de texto
    function imprimirTicket() {

        if (!impresoraLista) {
            return;
        }

        btnImprimir.disabled = true;
        btnImprimir.innerText = "ENVIANDO IMPRESIÓN...";

        try {

            const printer = IminPrintInstance;

            // Encabezado
            printer.setAlignment(1);
            printer.setTextSize(28);
            printer.setTextStyle(1);

            printer.printText("MINIMARKET RODOLFO", 1);

            printer.setTextStyle(0);
            printer.setTextSize(20);

            printer.printText("VOUCHER DE PRUEBA", 1);

            // Datos de venta
            printer.setAlignment(0);

            printer.printText("--------------------------------");

            printer.printText("Fecha: 16/11/2026");
            printer.printText("Venta: PRUEBA-001");
            printer.printText("Cliente: CLIENTE DE PRUEBA");

            printer.printText("--------------------------------");

            // Encabezado de columnas
            printer.setTextStyle(1);

            printer.printColumnsText(
                ["PRODUCTO", "CANT", "P.U.", "TOTAL"],
                [276, 60, 100, 140],
                [0, 1, 2, 2],
                20,
                576
            );

            printer.setTextStyle(0);

            // Productos de prueba
            printer.printColumnsText(
                ["Producto de prueba", "1", "25.00", "25.00"],
                [276, 60, 100, 140],
                [0, 1, 2, 2],
                20,
                576
            );

            printer.printText("--------------------------------");

            // Total
            printer.setTextStyle(1);

            printer.printColumnsText(
                ["TOTAL", "", "", "S/ 25.00"],
                [276, 60, 100, 140],
                [0, 1, 2, 2],
                22,
                576
            );

            printer.setTextStyle(0);

            printer.printText("--------------------------------");

            printer.printText("FORMA DE PAGO: CONTADO", 1);
            printer.printText("GRACIAS POR SU COMPRA", 1);

            // Avance final del papel
            printer.printText("\n\n");

            textoEstado.innerText =
                "Comandos enviados. Verifica la impresión física.";

        } catch (error) {

            textoEstado.innerText =
                "Error al enviar impresión: " + error;

        } finally {

            btnImprimir.disabled = false;
            btnImprimir.innerText = "IMPRIMIR TICKET DE PRUEBA";
        }
    }

    btnImprimir.addEventListener("click", imprimirTicket);

</script>

</body>
</html>
