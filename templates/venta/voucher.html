
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher de venta</title>

    {% load static %}
    <script src="{% static 'js/imin-printer.min.js' %}"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            text-align: center;
        }

        #estado {
            margin-top: 20px;
            font-size: 16px;
        }

        .volver {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #198754;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h3>MiniMarket Rodolfo</h3>
    <p>Procesando impresión del voucher...</p>

    <div id="estado">Conectando con la impresora...</div>

    <a class="volver" href="{% url 'venta_app:venta-index' %}">
        Volver al inicio
    </a>

    <script>
        const volverAlIndex = "{% url 'venta_app:venta-index' %}";

        async function imprimirVoucher() {
            const estado = document.getElementById("estado");

            try {
                const printer = new IminPrinter();

                estado.textContent = "Conectando con iMin Swan2...";

                const conectado = await printer.connect();

                if (!conectado) {
                    throw new Error("No se pudo conectar con la impresora.");
                }

                estado.textContent = "Impresora conectada. Imprimiendo...";

                printer.initPrinter();

                // Encabezado
                printer.setAlignment(1);
                printer.setTextSize(28);
                printer.setTextStyle(1);
                printer.printText("MINIMARKET RODOLFO");

                printer.setTextStyle(0);
                printer.setTextSize(20);
                printer.printText("VOUCHER DE VENTA");
                printer.printText("--------------------------------");

                // Datos de la venta
                printer.setAlignment(0);

                printer.printText(
                    "Fecha: {{ venta.date_sale|date:'d/m/Y H:i'|escapejs }}"
                );

                printer.printText(
                    "Cantidad de productos: {{ venta.count|escapejs }}"
                );

                printer.printText(
                    "Tipo de pago: {{ venta.get_type_invoce_display|escapejs }}"
                );

                printer.printText("--------------------------------");

                // Productos
                printer.setTextStyle(1);
                printer.printText("PRODUCTOS:");
                printer.setTextStyle(0);

                {% for producto in detalle_productos %}

                    printer.setTextSize(20);

                    printer.printText(
                        "{{ producto.product.name|truncatechars:30|escapejs }}"
                    );

                    printer.printText(
                        "Cantidad: {{ producto.count|escapejs }}"
                    );

                    printer.printText(
                        "Precio unitario: S/ {{ producto.price_sale|floatformat:2|escapejs }}"
                    );

                    printer.printText(
                        "Importe: S/ {{ producto.subtotal|floatformat:2|escapejs }}"
                    );

                    printer.printText("--------------------------------");

                {% endfor %}

                // Total
                printer.setTextSize(24);
                printer.setTextStyle(1);

                printer.printText(
                    "TOTAL: S/ {{ venta.amount|floatformat:2|escapejs }}"
                );

                printer.setTextStyle(0);
                printer.setTextSize(20);

                printer.printText("--------------------------------");

                // Despedida
                printer.setAlignment(1);
                printer.printText("¡GRACIAS POR SU COMPRA!");

                // Avance y corte de papel
                printer.printText("\n\n");
                printer.partialCut();

                estado.textContent =
                    "Voucher enviado a la impresora. Verifica la impresión.";

            } catch (error) {
                console.error("Error de impresión:", error);

                estado.textContent =
                    "Error de impresión: " + error.message +
                    ". Puedes volver a intentar o regresar al inicio.";
            }
        }

        window.addEventListener("load", imprimirVoucher);
    </script>

</body>
</html>
